<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070f" />
    <meta name="color-scheme" content="dark light" />
    <!-- Theme before first paint (no flash): saved choice → OS preference → dark. -->
    <script>
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        var r = document.documentElement;
        r.setAttribute("data-theme", t);
        r.style.colorScheme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "light" ? "#f4f3ef" : "#05070f");
      })();
    </script>
    <!-- Critical CSS for the static preloader (first frame, before any JS). -->
    <link rel="stylesheet" href="/preloader.css" />
    <title>Naumaan Kalyani — Full Stack Developer</title>
    <meta
      name="description"
      content="Portfolio of Naumaan Kalyani — Full Stack Developer in Ahmedabad building production web apps with React, Vue.js, Laravel and FastAPI."
    />

    <!-- Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Naumaan Kalyani — Full Stack Developer" />
    <meta
      property="og:description"
      content="Production web apps end to end — React, Vue.js, Laravel & FastAPI."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Naumaan Kalyani — Full Stack Developer" />
    <meta
      name="twitter:description"
      content="Production web apps end to end — React, Vue.js, Laravel & FastAPI."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Naumaan Kalyani",
        "jobTitle": "Full-stack Developer",
        "knowsAbout": ["React", "Laravel", "PHP", "MySQL", "Three.js", "GSAP", "Docker"]
      }
    </script>

    <!-- Fonts: preconnect + NON-render-blocking stylesheet (the preloader
         covers the brief fallback-font swap). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <!-- Static first frame of the preloader: paints before any JS runs, then
         React's <Preloader /> (identical markup) takes over seamlessly. -->
    <div id="root">
      <div class="preloader" aria-hidden="true">
        <div class="preloader__panel">
          <div class="preloader__top">
            <span class="preloader__brand">nk<sup>®</sup></span>
          </div>
          <div class="preloader__center"
            ><span class="preloader__mask"
              ><span class="preloader__words"
                ><span class="preloader__word">Think</span><span class="preloader__word">Design</span
                ><span class="preloader__word">Build</span><span class="preloader__word">Ship</span></span
              ></span
            ></div
          >
          <div class="preloader__bottom">
            <span class="preloader__bar"><span class="preloader__fill"></span></span>
            <span class="preloader__mask"
              ><span class="preloader__count"
                ><span class="preloader__col is-off"><span class="preloader__strip"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span></span></span
                ><span class="preloader__col is-off"><span class="preloader__strip"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span></span></span
                ><span class="preloader__col"><span class="preloader__strip"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span></span></span
                ><span class="preloader__pct">%</span></span
              ></span
            >
          </div>
        </div>
      </div>
    </div>
    <!-- When the static preloader's CSS loops started: React's copy continues in phase. -->
    <script>
      window.__preloaderT0 = performance.now();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
